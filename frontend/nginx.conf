server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass https://lead-management-071p.onrender.com;
    proxy_set_header Host lead-management-071p.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}